name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: sitemap lastmod is each page's last commit date.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
      # Root deps: the parity test runs the CLI and MCP server.
      - run: npm ci
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npm test
        working-directory: site
